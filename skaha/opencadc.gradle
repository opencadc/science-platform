sourceSets {
    intTest {
        java {
            compileClasspath += main.output + test.output
            runtimeClasspath += main.output + test.output
        }
        resources {
            srcDirs = ['src/intTest/resources']
        }
    }
}

configurations {
    // Configuration for integration tests
    intTestRuntime.extendsFrom testRuntime
    intTestImplementation.extendsFrom testImplementation
}

tasks.withType(Test).configureEach {
    // reset the report destinations so that intTests go to their own page
    reports.html.outputLocation = layout.buildDirectory.dir("reports/" + name)

    // Assign all Java system properties from
    // the command line to the tests
    systemProperties System.properties as Map<String, ? extends Object>
}

tasks.register('intTest', Test) {
    // set the configuration context
    testClassesDirs = sourceSets.intTest.output.classesDirs
    classpath = sourceSets.intTest.runtimeClasspath
    // run the tests always
    outputs.upToDateWhen { false }
}

// Launch and ingress session templates hold Helm directives. The session tests use them as the Skaha ConfigMap holds
// them, rendered from the chart at test time, so they always match the chart. Needs helm.
def skahaChart = file('../helm')
def renderedSkahaConfig = layout.buildDirectory.file('session-templates/skaha-config.yaml')

def helmDependencyBuild = tasks.register('helmDependencyBuild', Exec) {
    // helm template needs the chart's Redis subchart; fetched once into helm/charts/.
    onlyIf { !new File(skahaChart, 'charts').directory }
    commandLine 'helm', 'dependency', 'build', skahaChart.path
}

def renderSessionTemplates = tasks.register('renderSessionTemplates', Exec) {
    dependsOn helmDependencyBuild
    inputs.files(fileTree(skahaChart) { exclude 'charts/**', 'tests/**' })
    outputs.file(renderedSkahaConfig)
    commandLine 'helm', 'template', 'session-templates', skahaChart.path,
            '--show-only', 'templates/skaha-config-configmap.yaml',
            '--set', 'metrics.clusterName=c',
            '--set-string', 'metrics.env.METRICS_PROVIDERS__KUEUE__NAMESPACES=["w"]',
            '--set-string', 'metrics.env.METRICS_PROVIDERS__KUEUE__CLUSTER_QUEUES=["cq"]',
            '--set', 'deployment.skaha.sessions.userStorage.nodeURIPrefix=vos://storage.example.org~cavern'
    doFirst {
        final File output = renderedSkahaConfig.get().asFile
        output.parentFile.mkdirs()
        standardOutput = new FileOutputStream(output)
    }
    doLast {
        standardOutput.close()
    }
}

test {
    testLogging {
        events "PASSED", "FAILED", "SKIPPED"
        // "STARTED",
    }
    dependsOn renderSessionTemplates
    systemProperty 'skaha.sessionTemplates', renderedSkahaConfig.get().asFile.path
    // Session end-to-end tests run against the KubernetesApi mock server in this namespace.
    environment 'skaha.namespace', 'skaha-workload'
    environment 'SKAHA_SESSIONS_HOSTNAME', 'sessions.example.org'
    environment 'SKAHA_HOSTNAME', 'skaha.example.org'
    environment 'skaha.sessionexpiry', '345600'
}

intTest {
    testLogging {
        events "PASSED", "FAILED", "SKIPPED"
        // "STARTED",
    }
}
