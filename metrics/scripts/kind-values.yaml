image:
  repository: canfar-metrics-local
  # Default tag for values-only installs. scripts/kind-smoke.sh overrides this
  # with a unique tag unless KIND_SMOKE_SKIP_BUILD=1.
  tag: latest
  pullPolicy: Never

replicaCount: 2

clusterName: kind-metrics

networkPolicy:
  enabled: false

serviceAccount:
  create: true

rbac:
  create: true

kueue:
  clusterQueues:
    - cq-proton
    - cq-electron
    - cq-fair
  namespaces:
    - canfar-workloads
    - canfar-workloads-secondary

cacheKeySecret:
  name: metrics-test-cache-key
  key: key-secret

promql:
  baseUrl: "http://metrics-test-prometheus.metrics.svc:9090"

otel:
  endpoint: "http://metrics-test-otel-collector.metrics.svc:4318"

# Kubernetes endpoint, credentials, and CA come from the pod's ServiceAccount.
env:
  METRICS_OTEL__EXPORT_INTERVAL_MILLIS: "1000"
  METRICS_OTEL__DEPLOYMENT_ENVIRONMENT: "development"
  METRICS_OTEL__KUBERNETES_NAMESPACE: "metrics"

redis:
  urlSecret:
    name: metrics-test-redis
    key: redis-url
