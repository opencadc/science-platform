image:
  repository: canfar-metrics-local
  # Default tag for values-only installs. scripts/kind-smoke.sh overrides this
  # with a unique tag unless KIND_SMOKE_SKIP_BUILD=1.
  tag: latest
  pullPolicy: Never

serviceAccount:
  create: true

rbac:
  create: true
  workloadNamespaces:
    - canfar-workloads

env:
  METRICS_CLUSTER_NAME: "kind-metrics"
  METRICS_SOURCES__PLATFORM: "kueue"
  METRICS_SOURCES__USER: "kubernetes"
  METRICS_CACHE__BACKEND: "redis"
  # Local-only ephemeral integrity/HMAC key; deployed environments use a Secret.
  METRICS_CACHE__KEY_SECRET: "kind-metrics-cache-key-32-bytes!!"
  METRICS_OTEL__METRICS_ENABLED: "true"
  METRICS_OTEL__TRACES_ENABLED: "true"
  METRICS_OTEL__LOGS_ENABLED: "true"
  METRICS_OTEL__EXPORTER_OTLP_ENDPOINT: "http://metrics-api-collector:4318"
  METRICS_OTEL__EXPORT_INTERVAL_MILLIS: "1000"
  METRICS_OTEL__DEPLOYMENT_ENVIRONMENT: "development"
  METRICS_OTEL__KUBERNETES_NAMESPACE: "metrics"
  # Kubernetes endpoint/credentials/CA are discovered by kr8s from the pod's
  # service account; no transport settings are configured here.
  # JSON array: pydantic-settings decodes nested env with json.loads for list fields.
  METRICS_PROVIDERS__KUEUE__CLUSTER_QUEUES: '["cq-proton","cq-electron"]'
  METRICS_PROVIDERS__KUBERNETES__WORKLOAD_NAMESPACES: '["canfar-workloads"]'

redis:
  enabled: true

collector:
  enabled: true
  file:
    enabled: true
