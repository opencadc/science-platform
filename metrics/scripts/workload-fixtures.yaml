      labels: *shape-labels
    spec:
      runtimeClassName: metrics-overhead
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: &pod-security
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: initialize
          image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
          imagePullPolicy: IfNotPresent
          command: [sh, -c, "dd if=/dev/zero of=/tmp/init bs=1M count=4"]
          securityContext: &container-security
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 200m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 96Mi
      containers:
        - name: busy
          image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
          imagePullPolicy: IfNotPresent
          command: [sh, -c, "end=$(($(date +%s)+240)); while [ \"$(date +%s)\" -lt \"$end\" ]; do :; done"]
          securityContext: *container-security
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 96Mi
        - name: sidecar
          image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
          imagePullPolicy: IfNotPresent
          command: [sh, -c, "end=$(($(date +%s)+240)); while [ \"$(date +%s)\" -lt \"$end\" ]; do :; done"]
          securityContext: *container-security
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 75m
              memory: 48Mi
