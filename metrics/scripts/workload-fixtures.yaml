# Applied in phases by metrics.dev.fixtures. All activity is finite and local.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: integration-idle
  namespace: canfar-workloads
  labels: &borrowing-job-labels
    <<: &borrowing-pod-labels
      metrics.canfar.net/fixture-phase: borrowing
      app.kubernetes.io/managed-by: skaha
      app.kubernetes.io/part-of: canfar
      canfar.net/id: borrowing-bob
      canfar.net/username: bob
      canfar.net/name: borrowing-bob
      canfar.net/kind: headless
      canfar.net/job: integration-idle
      canfar.net/flavor: flexible
      canfar.net/accelerator: none
      canfar.net/community: astronomy
      canfar.net/project: usage-fixtures
    kueue.x-k8s.io/queue-name: lq-smoke
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels: *borrowing-pod-labels
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: &pod-security
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: busy
          image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - dd if=/dev/zero of=/tmp/activity bs=1M count=8 && end=$(($(date +%s)+240)); while [ "$(date +%s)" -lt "$end" ]; do :; done
          securityContext: &container-security
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 200m
              memory: 200Mi
            limits:
              cpu: 250m
              memory: 256Mi
