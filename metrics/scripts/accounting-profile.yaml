# Optional local accounting dependencies and deterministic producer fixture.
---
apiVersion: v1
kind: Namespace
metadata:
  name: metrics
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-kube-state-metrics
  namespace: metrics
  labels:
    metrics.canfar.net/profile: accounting
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metrics-kube-state-metrics
  labels:
    metrics.canfar.net/profile: accounting
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-kube-state-metrics
  labels:
    metrics.canfar.net/profile: accounting
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metrics-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: metrics-kube-state-metrics
    namespace: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-kube-state-metrics
  namespace: metrics
  labels:
    metrics.canfar.net/profile: accounting
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-kube-state-metrics
  template:
    metadata:
      labels:
        app: metrics-kube-state-metrics
    spec:
      serviceAccountName: metrics-kube-state-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.16.0
          args:
            - --resources=pods
            - --metric-labels-allowlist=pods=[canfar.net/username,canfar.net/community]
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-kube-state-metrics
  namespace: metrics
  labels:
    metrics.canfar.net/profile: accounting
spec:
  selector:
    app: metrics-kube-state-metrics
  ports:
    - name: http
      port: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-accounting-producer
  namespace: metrics
  labels:
    metrics.canfar.net/profile: accounting
data:
  producer.py: |
    import json
    import os
    import ssl
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from urllib.request import Request, urlopen

    token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    ca_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    api = "https://kubernetes.default.svc/api/v1/namespaces/canfar-workloads/pods"
    values = {
        "cpu": ("core-hours", "0.1", "0.2"),
        "memory": ("GiB-hours", "0.05", "0.1"),
    }

    def active_pods():
        token = open(token_path, encoding="utf-8").read()
        request = Request(api, headers={"Authorization": f"Bearer {token}"})
        with urlopen(request, context=ssl.create_default_context(cafile=ca_path), timeout=5) as response:
            pods = json.load(response)["items"]
        for pod in pods:
            labels = pod["metadata"].get("labels", {})
            if (
                pod.get("status", {}).get("phase") == "Running"
                and labels.get("app.kubernetes.io/managed-by") == "skaha"
                and labels.get("app.kubernetes.io/part-of") == "canfar"
                and labels.get("canfar.net/username")
                and labels.get("canfar.net/community")
            ):
                yield pod["metadata"]["uid"], labels

    def fixture_payload():
        lines = []
        for uid, pod_labels in active_pods():
            for resource, (unit, usage, requested) in values.items():
                labels = {
                    "cluster": "kind-metrics",
                    "namespace": "canfar-workloads",
                    "pod_uid": uid,
                    "resource": resource,
                    "canfar_username": pod_labels["canfar.net/username"],
                    "canfar_community": pod_labels["canfar.net/community"],
                    "source_revision": "1",
                }
                encoded = ",".join(f"{key}={json.dumps(value)}" for key, value in labels.items())
                lines.extend(
                    (
                        f'metrics_fixture_active_workload_usage_hours{{{encoded},unit="{unit}"}} {usage}',
                        f'metrics_fixture_active_workload_requested_hours{{{encoded},unit="{unit}"}} {requested}',
                        f'metrics_fixture_active_workload_accounting_complete'
                        f'{{{encoded},unit="boolean",reason="complete"}} 1',
                    )
                )
        return ("\n".join(lines) + "\n").encode()

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            try:
                payload = fixture_payload()
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4")
                self.end_headers()
                self.wfile.write(payload)
            except Exception:
                self.send_response(503)
                self.end_headers()

        def log_message(self, *_):
            pass

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-accounting-producer
  namespace: metrics
  labels:
    metrics.canfar.net/profile: accounting
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metrics-accounting-producer
  namespace: canfar-workloads
  labels:
    metrics.canfar.net/profile: accounting
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metrics-accounting-producer
  namespace: canfar-workloads
  labels:
    metrics.canfar.net/profile: accounting
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: metrics-accounting-producer
subjects:
  - kind: ServiceAccount
    name: metrics-accounting-producer
    namespace: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-accounting-producer
  namespace: metrics
  labels:
    metrics.canfar.net/profile: accounting
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: metrics-accounting-producer
  template:
    metadata:
      labels:
        app: metrics-accounting-producer
    spec:
      serviceAccountName: metrics-accounting-producer
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: producer
          image: python:3.13.5-alpine3.22
          command:
            - python
            - /fixture/producer.py
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: fixture
              mountPath: /fixture
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: fixture
          configMap:
            name: metrics-accounting-producer
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-accounting-producer
  namespace: metrics
  labels:
    metrics.canfar.net/profile: accounting
spec:
  selector:
    app: metrics-accounting-producer
  ports:
    - name: http
      port: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-accounting-prometheus
  namespace: metrics
  labels:
    metrics.canfar.net/profile: accounting
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/rules.yml
    scrape_configs:
      - job_name: kube-state-metrics
        static_configs:
          - targets: [metrics-kube-state-metrics.metrics.svc:8080]
      - job_name: accounting-producer
        static_configs:
          - targets: [metrics-accounting-producer.metrics.svc:8080]
  rules.yml: |
    groups:
      - name: canfar-accounting
        interval: 5s
        rules:
          - record: canfar_active_workload_usage_hours_total
            expr: max without (instance, job) (metrics_fixture_active_workload_usage_hours)
          - record: canfar_active_workload_requested_hours_total
            expr: max without (instance, job) (metrics_fixture_active_workload_requested_hours)
          - record: canfar_active_workload_accounting_complete
            expr: max without (instance, job) (metrics_fixture_active_workload_accounting_complete)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-accounting-prometheus
  namespace: metrics
  labels:
    metrics.canfar.net/profile: accounting
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: metrics-accounting-prometheus
  template:
    metadata:
      labels:
        app: metrics-accounting-prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: metrics-accounting-prometheus
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-accounting-prometheus
  namespace: metrics
  labels:
    metrics.canfar.net/profile: accounting
spec:
  selector:
    app: metrics-accounting-prometheus
  ports:
    - name: http
      port: 9090
