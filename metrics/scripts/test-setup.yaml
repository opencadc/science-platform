# Kueue smoke: cluster objects, workload namespace, LocalQueue, and busy Job.
# Keep names aligned with scripts/kind-values.yaml (and any local smoke values file).
# Apply after Kueue controller is installed. Queueing/preemption/fungibility use
# Kueue defaults; cq-electron's small quota forces the Workload to borrow.
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: default-flavor
  labels:
    app.kubernetes.io/part-of: metrics-kueue-smoke
spec: {}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: Cohort
metadata:
  name: cohort-atom
  labels:
    app.kubernetes.io/part-of: metrics-kueue-smoke
spec:
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: "3"
            - name: memory
              nominalQuota: "8Gi"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-proton
  labels:
    app.kubernetes.io/part-of: metrics-kueue-smoke
spec:
  cohortName: cohort-atom
  namespaceSelector: {}
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: "10"
            - name: memory
              nominalQuota: "20Gi"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-electron
  labels:
    app.kubernetes.io/part-of: metrics-kueue-smoke
spec:
  cohortName: cohort-atom
  namespaceSelector: {}
  resourceGroups:
    - coveredResources:
        - cpu
        - memory
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: "100m"
              borrowingLimit: "1"
            - name: memory
              nominalQuota: "100Mi"
              borrowingLimit: "1Gi"
---
apiVersion: v1
kind: Namespace
metadata:
  name: canfar-workloads
  labels:
    app.kubernetes.io/part-of: metrics-kueue-smoke
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: lq-smoke
  namespace: canfar-workloads
  labels:
    app.kubernetes.io/part-of: metrics-kueue-smoke
spec:
  clusterQueue: cq-electron
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: Workload
metadata:
  name: integration-idle
  namespace: canfar-workloads
  labels:
    app.kubernetes.io/part-of: metrics-kueue-smoke
spec:
  active: true
  queueName: lq-smoke
  podSets:
    - name: main
      count: 1
      template:
        spec:
          restartPolicy: Always
          containers:
            - name: idle
              image: alpine:3.20
              command: ["tail", "-f", "/dev/null"]
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: "200m"
                  memory: "200Mi"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: integration-busy
  namespace: canfar-workloads
  labels:
    app.kubernetes.io/managed-by: skaha
    app.kubernetes.io/part-of: canfar
    canfar.net/username: metrics-user
    canfar.net/community: metrics-community
    kueue.x-k8s.io/queue-name: lq-smoke
spec:
  suspend: true
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: skaha
        app.kubernetes.io/part-of: canfar
        canfar.net/username: metrics-user
        canfar.net/community: metrics-community
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: busy
          image: alpine:3.20
          command: ["sh", "-c", "while true; do :; done"]
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
