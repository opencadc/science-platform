# Deterministic Kueue topology. metrics.dev.fixtures applies phased Jobs after
# these objects become Active.
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: default-flavor
  labels:
    app.kubernetes.io/part-of: metrics-kueue-smoke
    metrics.canfar.net/fixture-owner: metrics-dev
spec: {}
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: metrics-overhead
  labels:
    metrics.canfar.net/fixture-owner: metrics-dev
handler: runc
overhead:
  podFixed:
    cpu: 10m
    memory: 8Mi
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-proton
  labels:
    app.kubernetes.io/part-of: metrics-kueue-smoke
    canfar.net/community: physics
    metrics.canfar.net/fixture-owner: metrics-dev
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: [cpu, memory]
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: "2"
            - name: memory
              nominalQuota: "2Gi"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-electron
  labels:
    app.kubernetes.io/part-of: metrics-kueue-smoke
    canfar.net/community: astronomy
    metrics.canfar.net/fixture-owner: metrics-dev
spec:
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: [cpu, memory]
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: "1"
            - name: memory
              nominalQuota: "1Gi"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cq-fair
  labels:
    app.kubernetes.io/part-of: metrics-kueue-smoke
    canfar.net/community: astronomy
    metrics.canfar.net/fixture-owner: metrics-dev
spec:
  admissionScope:
    admissionMode: UsageBasedAdmissionFairSharing
  namespaceSelector: {}
  resourceGroups:
    - coveredResources: [cpu, memory]
      flavors:
        - name: default-flavor
          resources:
            - name: cpu
              nominalQuota: "300m"
            - name: memory
              nominalQuota: "256Mi"
---
apiVersion: v1
kind: Namespace
metadata:
  name: canfar-workloads
  labels:
    app.kubernetes.io/part-of: metrics-kueue-smoke
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: canfar-workloads-secondary
  labels:
    app.kubernetes.io/part-of: metrics-kueue-smoke
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: lq-smoke
  namespace: canfar-workloads
  labels:
    app.kubernetes.io/part-of: metrics-kueue-smoke
    canfar.net/username: bob
    canfar.net/community: astronomy
    metrics.canfar.net/fixture-owner: metrics-dev
spec:
  clusterQueue: cq-electron
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: lq-fair-high
  namespace: canfar-workloads
  labels:
    app.kubernetes.io/part-of: metrics-kueue-smoke
    canfar.net/username: alice
    canfar.net/community: astronomy
    metrics.canfar.net/fixture-owner: metrics-dev
spec:
  clusterQueue: cq-fair
  fairSharing:
    weight: "1"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: lq-fair-low
  namespace: canfar-workloads
  labels:
    app.kubernetes.io/part-of: metrics-kueue-smoke
    canfar.net/username: carol
    canfar.net/community: astronomy
    metrics.canfar.net/fixture-owner: metrics-dev
spec:
  clusterQueue: cq-fair
  fairSharing:
    weight: "1"
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: lq-bob-physics
  namespace: canfar-workloads-secondary
  labels:
    app.kubernetes.io/part-of: metrics-kueue-smoke
    canfar.net/username: bob
    canfar.net/community: physics
    metrics.canfar.net/fixture-owner: metrics-dev
spec:
  clusterQueue: cq-proton
