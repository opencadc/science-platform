# Disposable integration dependencies. These resources are owned by
# metrics-dev only; the production Helm chart references external equivalents.
---
apiVersion: v1
kind: Namespace
metadata:
  name: metrics
  labels:
    metrics.canfar.net/test-only: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: metrics-test-redis
  namespace: metrics
  labels:
    metrics.canfar.net/test-only: "true"
type: Opaque
stringData:
  redis-url: redis://metrics-test-redis.metrics.svc:6379/0
---
apiVersion: v1
kind: Secret
metadata:
  name: metrics-test-cache-key
  namespace: metrics
  labels:
    metrics.canfar.net/test-only: "true"
type: Opaque
stringData:
  key-secret: kind-metrics-cache-key-32-bytes!!
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-test-redis
  namespace: metrics
  labels:
    app: metrics-test-redis
    metrics.canfar.net/test-only: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: metrics-test-redis
  template:
    metadata:
      labels:
        app: metrics-test-redis
        metrics.canfar.net/test-only: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          args: [redis-server, --save, "", --appendonly, "no"]
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            exec:
              command: [redis-cli, ping]
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            exec:
              command: [redis-cli, ping]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-test-redis
  namespace: metrics
  labels:
    metrics.canfar.net/test-only: "true"
spec:
  selector:
    app: metrics-test-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-test-kube-state-metrics
  namespace: metrics
  labels:
    metrics.canfar.net/test-only: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metrics-test-kube-state-metrics
  labels:
    metrics.canfar.net/test-only: "true"
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-test-kube-state-metrics
  labels:
    metrics.canfar.net/test-only: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metrics-test-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: metrics-test-kube-state-metrics
    namespace: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-test-kube-state-metrics
  namespace: metrics
  labels:
    app: metrics-test-kube-state-metrics
    metrics.canfar.net/test-only: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-test-kube-state-metrics
  template:
    metadata:
      labels:
        app: metrics-test-kube-state-metrics
        metrics.canfar.net/test-only: "true"
    spec:
      serviceAccountName: metrics-test-kube-state-metrics
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.16.0
          args:
            - --resources=pods
            - --metric-labels-allowlist=pods=[canfar.net/username,canfar.net/community]
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-test-kube-state-metrics
  namespace: metrics
  labels:
    metrics.canfar.net/test-only: "true"
spec:
  selector:
    app: metrics-test-kube-state-metrics
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-test-prometheus
  namespace: metrics
  labels:
    metrics.canfar.net/test-only: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metrics-test-prometheus
  labels:
    metrics.canfar.net/test-only: "true"
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-test-prometheus
  labels:
    metrics.canfar.net/test-only: "true"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: metrics-test-prometheus
subjects:
  - kind: ServiceAccount
    name: metrics-test-prometheus
    namespace: metrics
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-test-prometheus
  namespace: metrics
  labels:
    metrics.canfar.net/test-only: "true"
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
      external_labels:
        cluster: kind-metrics
    scrape_configs:
      - job_name: kube-state-metrics
        static_configs:
          - targets: [metrics-test-kube-state-metrics.metrics.svc:8080]
            labels:
              cluster: kind-metrics
        metric_relabel_configs:
          - action: labeldrop
            regex: "^(job|instance)$"
      - job_name: kubelet-cadvisor
        scheme: https
        kubernetes_sd_configs:
          - role: node
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        relabel_configs:
          - action: replace
            target_label: __address__
            replacement: kubernetes.default.svc:443
          - action: replace
            source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            regex: (.+)
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
          - action: replace
            target_label: cluster
            replacement: kind-metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-test-prometheus
  namespace: metrics
  labels:
    app: metrics-test-prometheus
    metrics.canfar.net/test-only: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: metrics-test-prometheus
  template:
    metadata:
      labels:
        app: metrics-test-prometheus
        metrics.canfar.net/test-only: "true"
    spec:
      serviceAccountName: metrics-test-prometheus
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: quay.io/prometheus/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: metrics-test-prometheus
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-test-prometheus
  namespace: metrics
  labels:
    metrics.canfar.net/test-only: "true"
spec:
  selector:
    app: metrics-test-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-test-otel-collector
  namespace: metrics
  labels:
    metrics.canfar.net/test-only: "true"
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      debug:
        verbosity: basic
      file:
        path: /var/lib/otel/evidence.json
    service:
      extensions: [health_check]
      pipelines:
        metrics:
          receivers: [otlp]
          exporters: [debug, file]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-test-otel-collector
  namespace: metrics
  labels:
    app: metrics-test-otel-collector
    metrics.canfar.net/test-only: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-test-otel-collector
  template:
    metadata:
      labels:
        app: metrics-test-otel-collector
        metrics.canfar.net/test-only: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.123.0
          args: [--config=/etc/otelcol/config.yaml]
          ports:
            - name: otlp-http
              containerPort: 4318
            - name: health
              containerPort: 13133
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: evidence
              mountPath: /var/lib/otel
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: config
          configMap:
            name: metrics-test-otel-collector
        - name: evidence
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-test-otel-collector
  namespace: metrics
  labels:
    metrics.canfar.net/test-only: "true"
spec:
  selector:
    app: metrics-test-otel-collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
