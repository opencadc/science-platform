# Metrics Python checks (run from repo root or metrics/); generic file hooks
# and the unit-test gate run in the root pre-commit config and CI respectively.
#   pre-commit run --config metrics/.pre-commit-config.yaml --all-files
---
default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^metrics/(src|tests)/
      - id: ruff-format
        files: ^metrics/(src|tests)/
