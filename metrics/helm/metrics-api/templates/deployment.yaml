apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "metrics-api.fullname" . }}-metrics-api
  labels:
    {{- include "metrics-api.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "metrics-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "metrics-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "metrics-api.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: metrics-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- if .Values.redis.enabled }}
            - name: METRICS_REDIS_URL
              value: {{ printf "redis://%s-redis:6379/0" (include "metrics-api.fullname" .) | quote }}
            {{- else if .Values.redis.urlSecret.name }}
            - name: METRICS_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.urlSecret.name | quote }}
                  key: {{ .Values.redis.urlSecret.key | quote }}
            {{- end }}
            {{- if .Values.cacheKeySecret.name }}
            - name: METRICS_CACHE__KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cacheKeySecret.name | quote }}
                  key: {{ .Values.cacheKeySecret.key | quote }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          # Uvicorn does not accept connections until Kueue startup validation
          # (lifespan) finishes. Without a startupProbe, liveness hits :8000 while
          # the port is still closed → connection refused → restarts even when the
          # cluster is healthy. Startup probe gates liveness/readiness until /healthz works.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 40
            periodSeconds: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
