{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "metrics-api.fullname" . }}-metrics-api
  labels:
    {{- include "metrics-api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "metrics-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
  egress:
    {{- range $rules := .Values.networkPolicy.egress }}
    {{- if $rules }}
    {{- toYaml $rules | nindent 4 }}
    {{- end }}
    {{- end }}
    {{- if .Values.redis.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "metrics-api.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: redis
      ports:
        - port: 6379
          protocol: TCP
    {{- end }}
{{- end }}
