{{- if .Values.collector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "metrics-api.fullname" . }}-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
    exporters:
      debug:
        verbosity: basic
{{ if .Values.collector.file.enabled }}
      file:
        path: /var/lib/otel/evidence.json
        format: json
{{ end }}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug{{ if .Values.collector.file.enabled }}, file{{ end }}]
        metrics:
          receivers: [otlp]
          exporters: [debug{{ if .Values.collector.file.enabled }}, file{{ end }}]
        logs:
          receivers: [otlp]
          exporters: [debug{{ if .Values.collector.file.enabled }}, file{{ end }}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "metrics-api.fullname" . }}-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "metrics-api.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: collector
  template:
    metadata:
      labels:
        {{- include "metrics-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: collector
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: {{ .Values.collector.image | quote }}
          args: ["--config=/etc/otelcol/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
          ports:
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            {{ if .Values.collector.file.enabled }}
            - name: evidence
              mountPath: /var/lib/otel
            {{ end }}
        {{ if .Values.collector.file.enabled }}
        - name: evidence
          image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
          command: ["sleep", "infinity"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 65532
            runAsGroup: 65532
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: evidence
              mountPath: /var/lib/otel
              readOnly: true
        {{ end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "metrics-api.fullname" . }}-collector
        {{ if .Values.collector.file.enabled }}
        - name: evidence
          emptyDir: {}
        {{ end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "metrics-api.fullname" . }}-collector
spec:
  selector:
    {{- include "metrics-api.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: collector
  ports:
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
{{- end }}
