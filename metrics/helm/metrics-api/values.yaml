# Default chart values (override with values-dev.yaml for local/dev flows)
image:
  repository: images.opencadc.org/platform/metrics
  tag: latest
  pullPolicy: IfNotPresent

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  fsGroup: 65532

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

# -- Flat fail-closed Settings map. Supported provider/source keys are
# METRICS_PROVIDERS__KUEUE__* and METRICS_SOURCES__PLATFORM=kueue; unknown
# provider, source, cache, and Kueue fields fail application startup.
env: {}

# Existing Secret containing the required cache HMAC/integrity key.
cacheKeySecret:
  name: ""
  key: key-secret

serviceAccount:
  create: false
  name: ""

rbac:
  create: false

# When enabling rbac.create, set serviceAccount.create: true (and optionally
# serviceAccount.name) so the ClusterRoleBinding does not attach read access to
# the namespace default ServiceAccount by accident.

redis:
  # Embedded Redis is local-only. Production supplies urlSecret.
  enabled: false
  image: redis:7-alpine
  urlSecret:
    name: ""
    key: redis-url

collector:
  enabled: false
  image: otel/opentelemetry-collector:0.123.0
