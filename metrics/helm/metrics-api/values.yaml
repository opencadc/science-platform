# Default chart values (override with values-dev.yaml for local/dev flows).
image:
  repository: images.opencadc.org/platform/metrics
  # Empty uses "v" + the chart appVersion, which release-please keeps equal to
  # the package version.
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1
terminationGracePeriodSeconds: 30
# Seconds to keep serving after termination starts, while endpoint removal
# propagates. Must stay below terminationGracePeriodSeconds.
preStopSleepSeconds: 5

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Public platform path segment for GET .../metrics/platform/{name}.
platformName: canfar

# Required stable lower-case DNS identity for this Metrics deployment. It scopes
# cache identities and must match the Prometheus/Mimir cluster label.
clusterName: ""

# Additional METRICS_* settings. Kueue lists, Redis, PromQL, and OTLP are
# rendered from the structured values below so secret-backed values cannot be
# accidentally replaced by plaintext entries in this map.
env: {}

kueue:
  # ClusterQueues served by this Metrics instance. These become resourceNames
  # in the ClusterRole when rbac.create is enabled.
  clusterQueues: []
  # Namespaces searched for User LocalQueues, Session Jobs, Pods, and
  # PodMetrics; PromQL queries are scoped to them too. A Role is rendered for
  # each entry.
  namespaces: []

promql:
  # Optional Prometheus or Mimir HTTP base URL. Empty disables efficiency.
  baseUrl: ""
  # Optional Mimir tenant header. It is rendered only when baseUrl is set.
  mimirTenantId: ""

otel:
  # Optional operator-provided OTLP/HTTP endpoint. The chart never deploys a
  # Collector; this value is only passed to the Metrics API.
  endpoint: ""

# Existing Secret containing the required cache HMAC/integrity key.
cacheKeySecret:
  name: metrics-api-cache
  key: key-secret

serviceAccount:
  create: false
  name: ""

rbac:
  create: false

# The selected name is always assigned to the API Pod. Set create: true for a
# chart-owned ServiceAccount, or leave it false and set name to an existing
# ServiceAccount with the required Kueue read access.

# Isolate the API Pod by default. External egress destinations must be allowed
# explicitly for the deployed network topology.
networkPolicy:
  enabled: true
  # Exact approved caller rules. Empty denies all ingress; a co-deployed Skaha
  # caller must be supplied here by the release values.
  ingress: []
  egress:
    dns:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
        ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
    # Required in deployed environments: allow the Kubernetes service CIDR on 443.
    kubeApiServer: []
    # Allow the configured external Redis endpoint.
    redis: []
    # Configure the operator-provided OTLP and PromQL destinations explicitly.
    otlp: []
    promql: []

redis:
  # Existing Secret containing the one shared external Redis URL.
  urlSecret:
    name: metrics-api-redis
    key: redis-url
