# Default chart values (override with values-dev.yaml for local/dev flows)
image:
  repository: images.opencadc.org/platform/metrics
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1
terminationGracePeriodSeconds: 30

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# -- Public platform path segment for GET .../metrics/platform/{name}.
# Operators set this to the name they publish for the ClusterQueue cohort this
# deployment serves. Injected as METRICS_PLATFORM_NAME (default canfar).
platformName: canfar

# -- Flat fail-closed Settings map. Supported provider/source keys are
# METRICS_PROVIDERS__KUEUE__*, METRICS_PROVIDERS__KUBERNETES__*,
# METRICS_SOURCES__PLATFORM=kueue, and METRICS_SOURCES__USER=kubernetes;
# unknown provider, source, or cache fields fail application startup.
# Prefer platformName for METRICS_PLATFORM_NAME; env may override it.
env: {}

# Existing Secret containing the required cache HMAC/integrity key.
cacheKeySecret:
  name: ""
  key: key-secret

serviceAccount:
  create: false
  name: ""

rbac:
  create: false
  # Namespaces receiving Pod list access for User metrics.
  workloadNamespaces: []

# When enabling rbac.create, set serviceAccount.create: true (and optionally
# serviceAccount.name) so the ClusterRoleBinding does not attach read access to
# the namespace default ServiceAccount by accident.

# Isolate the API Pod by default. Each egress group accepts complete Kubernetes
# NetworkPolicy egress rules so deployed environments can use CIDRs, namespace
# selectors, and Pod selectors appropriate to their CNI and service topology.
networkPolicy:
  enabled: true
  ingress:
    - ports:
        - port: 8000
          protocol: TCP
  egress:
    dns:
      - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
        ports:
          - port: 53
            protocol: UDP
          - port: 53
            protocol: TCP
    # Required in deployed environments: allow the Kubernetes service CIDR on 443.
    kubeApiServer: []
    # The embedded Redis selector is added automatically when redis.enabled.
    redis: []
    # Configure deployed OTLP and PromQL destinations explicitly.
    otlp: []
    promql: []

redis:
  # Embedded Redis is local-only. Production supplies urlSecret.
  enabled: false
  image: redis:7-alpine
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  urlSecret:
    name: ""
    key: redis-url

collector:
  # Local development only. Production points OTLP at an external Collector/Alloy.
  enabled: false
  image: otel/opentelemetry-collector-contrib:0.123.0
  file:
    # Smoke-only machine evidence; never enable in production values.
    enabled: false
