# Development values. Redis, Prometheus/Mimir, and OTLP are disposable
# external test fixtures; this values file never enables chart-owned services.
image:
  repository: images.opencadc.org/platform/metrics
  tag: v0.1.5
  pullPolicy: IfNotPresent

clusterName: dev-cluster

networkPolicy:
  enabled: false

serviceAccount:
  create: true

rbac:
  create: true

kueue:
  clusterQueues:
    - cq-proton
    - cq-electron
  namespaces:
    - canfar-workloads

redis:
  urlSecret:
    name: metrics-dev-redis
    key: redis-url

cacheKeySecret:
  name: metrics-dev-cache
  key: key-secret

promql:
  baseUrl: ""
  mimirTenantId: ""

otel:
  endpoint: ""

env:
  METRICS_OTEL__DEPLOYMENT_ENVIRONMENT: "development"
