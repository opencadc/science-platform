# Example CANFAR Metrics API configuration (deployed to /etc/canfar/metrics/config.yaml).
# `METRICS_*` overrides the same fields; non-empty files must have a top-level `metrics:` map.
# Default container path: /etc/canfar/metrics/config.yaml; override with METRICS_CONFIG_FILE.
metrics:
  providers:
    kueue:
      # Kubernetes endpoint/credentials/CA are discovered by kr8s from the
      # in-cluster service account or a kubeconfig (ADR-0023).
      cluster_queues:
        - cq-proton
      kueue_api_version: "kueue.x-k8s.io/v1beta2"
      kube_request_timeout_seconds: 10
  sources:
    platform: kueue
  cache:
    backend: redis
    ttl_seconds: 300
    scope_ttl_seconds:
      platform: 300
