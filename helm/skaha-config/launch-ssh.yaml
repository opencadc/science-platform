---
apiVersion: batch/v1
kind: Job
metadata:
  name: "${skaha.jobname}"
spec:
  parallelism: 1
  completions: 1
  activeDeadlineSeconds: 1209600
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      {{ template "skaha.job.nodeAffinity" . }}
      hostname: "${software.hostname}"
      initContainers:
      {{ template "skaha.job.initContainers" . }}
      securityContext:
        {{ template "skaha.job.securityContext" . }}
      containers:
      - name: "${skaha.jobname}"
        image: "${software.imageid}"
        command: ["/usr/sbin/sshd"]
        args: ["-D", "-e"]
        ports:
        - containerPort: 22
          name: ssh
          protocol: TCP
        env:
        - name: skaha_hostname
          value: "${skaha.hostname}"
        - name: skaha_username
          value: "${skaha.userid}"
        - name: skaha_sessionid
          value: "${skaha.sessionid}"
        - name: HOME
          value: "${SKAHA_USER_HOME_DIR}"
        - name: PWD
          value: "${SKAHA_USER_HOME_DIR}"
        securityContext:
          privileged: false
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        workingDir: "${SKAHA_USER_HOME_DIR}"
        imagePullPolicy: {{ .Values.deployment.skaha.sessions.imagePullPolicy | required "deployment.skaha.sessions.imagePullPolicy must be set." }}
        resources:
          requests:
            memory: "${software.requests.ram}"
            cpu: "${software.requests.cores}"
            ephemeral-storage: "{{ .Values.deployment.skaha.sessions.minEphemeralStorage }}"
          limits:
            memory: "${software.limits.ram}"
            cpu: "${software.limits.cores}"
            ephemeral-storage: "{{ .Values.deployment.skaha.sessions.maxEphemeralStorage }}"
        volumeMounts:
        - mountPath: "/etc/passwd"
          name: etc-passwd
          subPath: passwd
        - mountPath: "/etc/group"
          name: etc-group
          subPath: group
        - mountPath: "/etc/ssh/sshd_config.d/skaha.conf"
          name: sshd-config
          subPath: sshd.conf
        - mountPath: "/etc/ssh/skaha/authorized_keys"
          name: ssh-host-auth
          subPath: authorized_keys
          readOnly: true
        - mountPath: "${SKAHA_USER_HOME_DIR}"
          name: cavern-volume
          subPath: "cavern/home/${skaha.userid}"
        - mountPath: "${SKAHA_PROJECTS_DIR}"
          name: cavern-volume
          subPath: "cavern/projects"
        - mountPath: "/scratch"
          name: scratch-dir
          subPath: "${skaha.sessionid}"
        - mountPath: "/dev/shm"
          name: dshm-volume
      {{- with .Values.deployment.skaha.sessions.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      - name: etc-group
        emptyDir: { }
      - name: etc-passwd
        emptyDir: { }
      - name: init-users-groups
        configMap:
          name: {{ .Release.Name }}-init-users-groups-config
          defaultMode: 0777
      - name: sshd-config
        configMap:
          name: {{ .Release.Name }}-ssh-sshd-config
          defaultMode: 0644
      - name: ssh-host-auth
        secret:
          secretName: "${skaha.ssh.hostauth.secret}"
          defaultMode: 0600
      {{ template "skaha.session.commonVolumes" . }}
