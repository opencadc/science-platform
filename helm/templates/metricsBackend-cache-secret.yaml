{{- $_ := include "skaha.metricsBackend.assertRequired" . }}
{{- $name := include "skaha.metricsBackend.cacheSecretName" . }}
{{- $key := include "skaha.metricsBackend.cacheSecretKey" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $value := "" }}
{{- if and $existing $existing.data (hasKey $existing.data $key) }}
{{- $value = index $existing.data $key }}
{{- else }}
{{- $value = uuidv4 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skaha.metricsBackend.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key }}: {{ $value | quote }}
