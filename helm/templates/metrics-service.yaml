{{- $_ := include "skaha.metrics.assertRequired" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skaha.metrics.serviceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skaha.metrics.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "skaha.metrics.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
