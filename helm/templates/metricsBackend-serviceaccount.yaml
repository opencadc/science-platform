{{- $mb := .Values.metricsBackend | default dict }}
{{- $serviceAccount := $mb.serviceAccount | default dict }}
{{- $create := true }}
{{- if hasKey $serviceAccount "create" }}
{{- $create = get $serviceAccount "create" }}
{{- end }}
{{- if and (default false $mb.enabled) $create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "skaha.metricsBackend.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skaha.metricsBackend.labels" . | nindent 4 }}
  {{- with $serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ if hasKey $serviceAccount "automount" }}{{ get $serviceAccount "automount" }}{{ else }}true{{ end }}
{{- end }}
