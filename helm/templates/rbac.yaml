{{- with .Values.rbac }}
{{- if .create }}
{{- $roleName := printf "%s-workload-controller" $.Release.Name | trunc 63 | trimSuffix "-" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $roleName }}
  namespace: {{ include "skaha.workloadNamespace" $ }}
rules:
# Skaha's own calls; the Metrics API shares this ServiceAccount and reads Jobs and Pods.
- apiGroups: [""]
  resources: ["events", "limitranges"]
  verbs: ["get", "list"]

# Session Jobs: launch (create, read-back, delete on failure), list and watch (session cache), renew (patch), delete.
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "deletecollection", "delete", "get", "list", "patch", "watch"]

# Session Pods: events, logs and the desktop-app target IP.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]

- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]

# Session Services, created with their Job and deleted with it by owner reference.
- apiGroups: [""]
  resources: ["services"]
  verbs: ["create"]

# Image pull Secrets (server-side apply) and the callback signing Secret (create if absent).
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create", "get", "patch"]

# Session ingress, created with its Job and deleted with it by owner reference.
- apiGroups: ["traefik.io"]
  resources: ["ingressroutes", "middlewares"]
  verbs: ["create"]

- apiGroups: ["metrics.k8s.io"]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $roleName }}
  namespace: {{ include "skaha.workloadNamespace" $ }}
subjects:
- kind: ServiceAccount
  name: {{ include "skaha.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $roleName }}
  apiGroup: rbac.authorization.k8s.io
{{- if .clusterRole.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-list-cluster-role
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
# This cluster role binding allows the Skaha service account to read secrets in any namespace.
kind: ClusterRoleBinding
metadata:
  name: read-secrets-global
subjects:
- kind: ServiceAccount
  name: {{ include "skaha.serviceAccountName" $ }}
  namespace: {{ $.Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: node-list-cluster-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
{{- end }}
