{{- $mb := .Values.metricsBackend | default dict }}
{{- if (default false $mb.enabled) }}
{{- $img := $mb.image | default dict }}
{{- $queueConfig := include "skaha.metricsBackend.clusterQueues" . | trim }}
{{- if not $queueConfig }}
{{- fail "metricsBackend.enabled requires METRICS_PROVIDERS__KUEUE__CLUSTER_QUEUES" }}
{{- end }}
{{- $_ := include "skaha.metricsBackend.clusterName" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skaha.metricsBackend.deploymentName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skaha.metricsBackend.labels" . | nindent 4 }}
spec:
  replicas: {{ $mb.replicaCount | default 1 }}
  revisionHistoryLimit: {{ $mb.revisionHistoryLimit | default 3 }}
  selector:
    matchLabels:
      {{- include "skaha.metricsBackend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "skaha.metricsBackend.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "skaha.metricsBackend.serviceAccountName" . }}
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: metrics-api
          image: "{{ $img.repository }}:{{ $img.tag | default "v0.1.5" }}"
          imagePullPolicy: {{ $img.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            {{- include "skaha.metricsBackend.env" . | nindent 12 }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 40
            periodSeconds: 3
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 0
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
          {{- with $mb.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
