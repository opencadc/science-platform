{{/*
CANFAR Science Platform Grafana dashboards.

One ConfigMap per dashboard in helm/dashboards, labelled for the Grafana sidecar to
collect and annotated with the folder to file it under.

`tpl` is deliberately NOT used on the dashboard bodies: Grafana legend formats are
written as {{ "{{" }}label{{ "}}" }} and Helm would try to evaluate them.
*/}}
{{- $cfg := .Values.grafanaDashboards | default dict -}}
{{- if $cfg.enabled -}}
{{- $ctx := . -}}
{{- $namespace := $cfg.namespace | default $ctx.Release.Namespace -}}
{{- $files := $ctx.Files.Glob "dashboards/*.json" -}}
{{- if not $files }}
  {{- fail "grafanaDashboards.enabled is true but no dashboard JSON was found under helm/dashboards" -}}
{{- end -}}
{{- range $path, $_ := $files }}
{{- $stem := trimSuffix ".json" (base $path) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-grafana-dashboard-%s" $ctx.Release.Name $stem | trunc 63 | trimSuffix "-" }}
  namespace: {{ $namespace }}
  labels:
    {{- include "skaha.labels" $ctx | nindent 4 }}
    {{ $cfg.sidecarLabel | default "grafana_dashboard" }}: {{ $cfg.sidecarLabelValue | default "1" | quote }}
  annotations:
    {{- with $cfg.folder }}
    grafana_folder: {{ . | quote }}
    {{- end }}
    {{- with $cfg.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  {{/* Prefixed so the key is unique in the sidecar's shared dashboard directory. */}}
  canfar-{{ $stem }}.json: |-
    {{- $ctx.Files.Get $path | nindent 4 }}
{{- end }}
{{- end }}
