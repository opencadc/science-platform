{{- $mb := .Values.metrics | default dict }}
{{- $networkPolicy := $mb.networkPolicy | default dict }}
{{- $enabled := true }}
{{- if hasKey $networkPolicy "enabled" }}
{{- $enabled = $networkPolicy.enabled }}
{{- end }}
{{- $test := $mb.test | default dict }}
{{- $testEnabled := true }}
{{- if hasKey $test "enabled" }}
{{- $testEnabled = $test.enabled }}
{{- end }}
{{- $_ := include "skaha.metrics.assertRequired" . }}
{{- if $enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "skaha.metrics.nameWithSuffix" (dict "context" . "suffix" "skaha-metrics-api-networkpolicy") }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skaha.metrics.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "skaha.metrics.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- $ingress := $networkPolicy.ingress | default dict }}
    {{- $skaha := $ingress.skaha | default dict }}
    {{- $skahaPorts := list (dict "port" 8000 "protocol" "TCP") }}
    {{- $additionalIngress := $ingress.additional | default list }}
    {{- if hasKey $skaha "ports" }}
    {{- $skahaPorts = $skaha.ports }}
    {{- end }}
    {{- if $skahaPorts }}
    - from:
        - podSelector:
            matchLabels:
              run: {{ printf "%s-skaha-tomcat" $.Release.Name }}
      ports:
        {{- toYaml $skahaPorts | nindent 8 }}
    {{- end }}
    {{- if $testEnabled }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: metrics-test
      ports:
        - port: 8000
          protocol: TCP
    {{- end }}
    {{- if and (not $skahaPorts) (not $additionalIngress) (not $testEnabled) }}
    []
    {{- end }}
    {{- with $additionalIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  egress:
    {{- $renderedEgress := false }}
    {{- if not (trim (get ($mb.redis | default dict) "url" | default "" | toString)) }}
    {{- $renderedEgress = true }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/name: redis
      ports:
        - port: 6379
          protocol: TCP
    {{- end }}
    {{- range $rules := ($networkPolicy.egress | default dict) }}
    {{- if $rules }}
    {{- $renderedEgress = true }}
    {{- toYaml $rules | nindent 4 }}
    {{- end }}
    {{- end }}
    {{- if not $renderedEgress }}
    []
    {{- end }}
{{- end }}
