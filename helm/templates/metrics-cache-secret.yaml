{{- $_ := include "skaha.metrics.assertRequired" . }}
{{- $name := include "skaha.metrics.cacheSecretName" . }}
{{- $key := include "skaha.metrics.cacheSecretKey" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $value := "" }}
{{- if and $existing $existing.data (hasKey $existing.data $key) }}
{{- $value = index $existing.data $key }}
{{- else }}
{{- $value = randBytes 32 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "skaha.metrics.labels" . | nindent 4 }}
immutable: true
type: Opaque
data:
  {{ $key }}: {{ $value | quote }}
