{{- if .Values.sshpiper.enabled }}
# Pipe CRD for sshpiper Kubernetes plugin (https://github.com/tg123/sshpiper).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: pipes.sshpiper.com
spec:
  group: sshpiper.com
  names:
    kind: Pipe
    listKind: PipeList
    plural: pipes
    singular: pipe
  scope: Namespaced
  versions:
  - name: v1beta1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              from:
                type: array
                items:
                  type: object
                  properties:
                    authorized_keys_data:
                      type: string
                    authorized_keys_file:
                      type: string
                    authorized_keys_secret:
                      type: object
                      properties:
                        name:
                          type: string
                    username:
                      type: string
                    htpasswd_data:
                      type: string
                    htpasswd_file:
                      type: string
                    username_regex_match:
                      type: boolean
                  required:
                  - username
              to:
                type: object
                properties:
                  host:
                    type: string
                  ignore_hostkey:
                    type: boolean
                  known_hosts_data:
                    type: string
                  private_key_secret:
                    type: object
                    properties:
                      name:
                        type: string
                  password_secret:
                    type: object
                    properties:
                      name:
                        type: string
                  username:
                    type: string
                required:
                - host
            required:
            - from
            - to
    additionalPrinterColumns:
    - jsonPath: .spec.from[0].username
      name: FromUser
      type: string
    - jsonPath: .spec.to.username
      name: ToUser
      type: string
    - jsonPath: .spec.to.host
      name: ToHost
      type: string
    subresources:
      status: {}
{{- end }}
