# Merge this fragment into the Skaha Application before installing chart 1.9.0.
# Replace placeholders with the rendered cache Secret's metadata.name and namespace.
# Long release names are hashed by the chart; do not reconstruct the Secret name.
# Preserve any existing ignoreDifferences rules and syncOptions.
spec:
  ignoreDifferences:
    - group: ""
      kind: Secret
      name: CACHE_SECRET_NAME
      namespace: RELEASE_NAMESPACE
      jsonPointers:
        - /data/key-secret
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
